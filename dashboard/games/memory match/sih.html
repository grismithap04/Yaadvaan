<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northeast India Memory Match</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Work+Sans:wght@600;700&display=swap');

  :root{
    --forest:#2F5233;
    --rust:#A8552E;
    --indigo:#2B3A4A;
    --cream:#F7F2E7;
    --paper:#FFFDF8;
    --line:#D2C8B4;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:var(--cream);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(47,82,51,0.08) 1px, transparent 0);
    background-size:22px 22px;
    font-family:'Work Sans', sans-serif;
    color:var(--indigo);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px;
    position: relative;
  }

  .card-container{
    width:100%;
    max-width:900px;
    background:var(--paper);
    border:3px solid var(--line);
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 24px rgba(0,0,0,0.08);
  }

  header{
    text-align:center;
    margin-bottom:12px;
  }

  .eyebrow{
    font-size:14px;
    color:var(--forest);
    font-weight:700;
    margin:0 0 2px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:28px;
    margin:0;
    color:var(--indigo);
  }

  /* Difficulty & Sub-Level Controls */
  .difficulty-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin: 14px 0 10px;
  }

  .tier-controls {
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  .tier-btn {
    font-family: 'Work Sans', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 8px 20px;
    border: 2px solid var(--line);
    border-radius: 20px;
    background: var(--paper);
    color: var(--indigo);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .tier-btn:hover {
    border-color: var(--forest);
    background: var(--cream);
  }

  .tier-btn.active {
    background: var(--forest);
    color: var(--paper);
    border-color: var(--forest);
  }

  .sub-controls {
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .sub-btn {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 6px 14px;
    border: 2px solid var(--line);
    border-radius: 16px;
    background: #F4EFE3;
    color: var(--indigo);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .sub-btn:hover {
    border-color: var(--rust);
    background: var(--cream);
  }

  .sub-btn.active {
    background: var(--rust);
    color: var(--paper);
    border-color: var(--rust);
  }

  .instruction-box {
    background: #EFE8D8;
    border: 2px solid var(--forest);
    border-radius: 12px;
    padding: 12px 16px;
    margin: 12px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .instruction-text {
    font-size: 15px;
    font-weight: 700;
    color: var(--indigo);
    line-height: 1.3;
    margin: 0;
  }

  .audio-btn {
    background: var(--rust);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  /* Metrics Dashboard CSS */
  .stats-dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: #F2EBDC;
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    margin: 12px 0;
  }

  .stat-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #6C6353;
  }

  .stat-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--indigo);
    margin-top: 2px;
  }

  /* Dynamic CSS Grid */
  .grid{
    display: grid;
    gap: 12px;
    margin: 16px 0;
    perspective: 1000px;
    grid-template-columns: repeat(var(--cols, 4), 1fr);
  }

  .tile{
    position:relative;
    aspect-ratio:3/4;
    cursor:pointer;
  }

  .tile.locked{ cursor:default; }

  .tile-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.45s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }

  .tile.flipped .tile-inner,
  .tile.matched .tile-inner{
    transform:rotateY(180deg);
  }

  .face{
    position:absolute;
    inset:0;
    border-radius:12px;
    backface-visibility:hidden;
    border:3px solid var(--line);
    overflow:hidden;
  }

  .face-back{
    background:var(--forest);
    background-image:
      repeating-linear-gradient(45deg, rgba(247,242,231,0.08) 0 8px, transparent 8px 16px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .face-back .mark{
    font-size:32px;
    color:var(--cream);
    opacity:0.85;
  }

  .face-front{
    background:#2B3A4A;
    transform:rotateY(180deg);
    position:relative;
    width:100%;
    height:100%;
  }

  .face-front img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .tile.matched .face{
    border-color:var(--rust);
  }

  footer{
    display:flex;
    justify-content:center;
  }

  .btn-primary{
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    font-weight:700;
    color:var(--paper);
    background:var(--forest);
    border:none;
    border-radius:10px;
    padding:12px 24px;
    cursor:pointer;
  }

  .btn-primary:hover{ background:#26402a; }

  /* Encouragement Popup Overlay */
  .encouragement-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    background: var(--paper);
    border: 3px solid var(--forest);
    border-radius: 20px;
    padding: 20px 32px;
    text-align: center;
    box-shadow: 0 12px 32px rgba(0,0,0,0.2);
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
  }

  .encouragement-popup.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }

  .popup-image {
    width: 90px;
    height: 90px;
    object-fit: contain;
    display: inline-block;
    animation: pulseBounce 0.8s ease infinite alternate;
  }

  .popup-text {
    font-size: 20px;
    font-weight: 700;
    color: var(--forest);
    margin: 8px 0 0;
  }

  @keyframes pulseBounce {
    0% { transform: scale(1) translateY(0); }
    100% { transform: scale(1.15) translateY(-8px); }
  }

  @media (max-width: 768px) {
    .grid {
      gap: 8px;
      grid-template-columns: repeat(min(var(--cols, 4), 5), 1fr);
    }
  }

  @media (max-width: 500px) {
    .grid {
      gap: 6px;
      grid-template-columns: repeat(min(var(--cols, 4), 4), 1fr);
    }
    .stats-dashboard { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<div class="card-container">
  <header>
    <p class="eyebrow">Seven Sisters &amp; Sikkim (সাতভনী আৰু ছিকিম)</p>
    <h1>Memory Match / স্মৃতিৰ খেল (অসমীয়া)</h1>
  </header>

  <!-- Difficulty Controls -->
  <div class="difficulty-wrapper">
    <div class="tier-controls" id="tierControls">
      <button class="tier-btn active" data-tier="easy">Easy (সহজ)</button>
      <button class="tier-btn" data-tier="medium">Medium (মধ্যম)</button>
      <button class="tier-btn" data-tier="hard">Hard (কঠিন)</button>
    </div>
    <div class="sub-controls" id="subControls"></div>
  </div>

  <div class="instruction-box">
    <p class="instruction-text" id="instructionText">স্বাগতম! ছবিৰ কাৰ্ডখনত টেপ কৰক।</p>
    <button class="audio-btn" id="listenBtn" onclick="repeatInstruction()">🔊 শুনক (Listen)</button>
  </div>

  <!-- Essential Metrics Panel -->
  <div class="stats-dashboard">
    <div class="stat-card">
      <span class="stat-label">Moves (খোজ)</span>
      <span class="stat-value" id="moves">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Pairs (যোৰ)</span>
      <span class="stat-value"><span id="pairsFound">0</span> / <span id="pairsTotal">3</span></span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Time Elapsed (পাৰ হোৱা সময়)</span>
      <span class="stat-value" id="timer">0s</span>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <button class="btn-primary" id="newGameBtn">Start New Game (নতুন খেল আৰম্ভ কৰক)</button>
  </footer>
</div>

<!-- Encouragement Popup Overlay -->
<div id="encouragementPopup" class="encouragement-popup" onclick="hideEncouragement()">
  <img class="popup-image" src="file:///C:/Users/jayas/Downloads/sih/emoji.png" alt="Encouragement" />
  <p class="popup-text">আগবাঢ়ি যাওক! (Keep going!)</p>
</div>

<script>
  // ==========================================
  // BHASHINI CONFIGURATION
  // ==========================================
  const BHASHINI_USER_ID = ""; 
  const BHASHINI_API_KEY = ""; 
  const BHASHINI_SERVICE_ID = "ai4bharat/indic-tts--gpu-u3";

  // 16 Items required to support up to 32 cards (16 pairs)
  const ITEMS = [
    { name: 'চাহ বাগান', img:'file:///C:/Users/jayas/Downloads/sih/tea-garden.jpg' },
    { name: 'অসমীয়া সংস্কৃতি', img:'file:///C:/Users/jayas/Downloads/sih/img1.jpg' },
    { name: 'বিহু নাচ', img:'file:///C:/Users/jayas/Downloads/sih/img2.jpg' },
    { name: 'এশিঙীয়া গঁৰ', img:'file:///C:/Users/jayas/Downloads/sih/img3.jpg' },
    { name: 'নামঘৰ', img:'file:///C:/Users/jayas/Downloads/sih/img4.jpg' },
    { name: 'প্ৰাকৃতিক সৌন্দৰ্য', img:'file:///C:/Users/jayas/Downloads/sih/img5.jpeg' },
    { name: 'জীৱন্ত শিপাৰ সাঁকো', img:'file:///C:/Users/jayas/Downloads/sih/root-bridge.jpg' },
    { name: 'লোককলা', img:'file:///C:/Users/jayas/Downloads/sih/img6.jpg' },
    { name: 'পৰম্পৰাগত সাজ-পাৰ', img:'file:///C:/Users/jayas/Downloads/sih/img7.jpg' },
    { name: 'পাহাৰীয়া দৃশ্য', img:'file:///C:/Users/jayas/Downloads/sih/img8.jpg' },
    { name: 'নদীৰ দৃশ্য', img:'file:///C:/Users/jayas/Downloads/sih/img9.jpg' },
    { name: 'ঐতিহাসিক ঠাই', img:'file:///C:/Users/jayas/Downloads/sih/img10.png' },
    { name: 'শৰাই', img:'file:///C:/Users/jayas/Downloads/sih/img11.jpg' },
    { name: 'জাপি', img:'file:///C:/Users/jayas/Downloads/sih/img12.jpg' },
    { name: 'কাৰেং ঘৰ', img:'file:///C:/Users/jayas/Downloads/sih/img13.jpg' },
    { name: 'কামাখ্যা মন্দিৰ', img:'file:///C:/Users/jayas/Downloads/sih/img14.jpg' }
  ];

  // Sub-levels Configuration
  const SUB_LEVELS = {
    easy: [
      { label: 'Level 1 (6 Cards / ৬খন কাৰ্ড)', pairs: 3, cols: 3 },
      { label: 'Level 2 (8 Cards / ৮খন কাৰ্ড)', pairs: 4, cols: 4 },
      { label: 'Level 3 (10 Cards / ১০খন কাৰ্ড)', pairs: 5, cols: 5 }
    ],
    medium: [
      { label: 'Level 1 (12 Cards / ১২খন কাৰ্ড)', pairs: 6, cols: 4 },
      { label: 'Level 2 (16 Cards / ১৬খন কাৰ্ড)', pairs: 8, cols: 4 },
      { label: 'Level 3 (20 Cards / ২০খন কাৰ্ড)', pairs: 10, cols: 5 }
    ],
    hard: [
      { label: 'Level 1 (24 Cards / ২৪খন কাৰ্ড)', pairs: 12, cols: 6 },
      { label: 'Level 2 (28 Cards / ২৮খন কাৰ্ড)', pairs: 14, cols: 7 },
      { label: 'Level 3 (32 Cards / ৩২খন কাৰ্ড)', pairs: 16, cols: 8 }
    ]
  };

  const FLIPBACK_DELAY = 1400;
  const IDLE_TIMEOUT_MS = 20000;

  const grid = document.getElementById('grid');
  const instructionText = document.getElementById('instructionText');
  const movesEl = document.getElementById('moves');
  const pairsFoundEl = document.getElementById('pairsFound');
  const pairsTotalEl = document.getElementById('pairsTotal');
  const timerEl = document.getElementById('timer');
  const newGameBtn = document.getElementById('newGameBtn');
  const tierControls = document.getElementById('tierControls');
  const subControls = document.getElementById('subControls');
  const encouragementPopup = document.getElementById('encouragementPopup');

  let currentTier = 'easy';
  let currentSubIndex = 0;
  let currentPairs = 3;
  let deck = [];
  let flipped = [];
  let matchedCount = 0;
  let moves = 0;
  let locked = false;
  let currentPrompt = '';
  let currentAudio = null;

  // Timer & Idle Variables
  let timerInterval = null;
  let secondsElapsed = 0;
  let timerStarted = false;
  let idleTimer = null;
  let popupHideTimer = null;

  async function speak(textInAssamese) {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }

    if (BHASHINI_USER_ID && BHASHINI_API_KEY) {
      try {
        const response = await fetch("https://dhruva-api.bhashini.gov.in/services/inference/pipeline", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": BHASHINI_API_KEY,
            "userID": BHASHINI_USER_ID
          },
          body: JSON.stringify({
            "pipelineTasks": [
              {
                "taskType": "tts",
                "config": {
                  "language": { "sourceLanguage": "as" },
                  "serviceId": BHASHINI_SERVICE_ID,
                  "gender": "female"
                }
              }
            ],
            "inputData": { "input": [{ "source": textInAssamese }] }
          })
        });

        const data = await response.json();
        const base64Audio = data.pipelineResponse[0].audio[0].audioContent;
        currentAudio = new Audio("data:audio/wav;base64," + base64Audio);
        currentAudio.play();
        return;
      } catch (err) {
        console.warn("Bhashini API call failed, switching to native Web Speech API:", err);
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(textInAssamese);
      
      const voices = window.speechSynthesis.getVoices();
      const asVoice = voices.find(v => v.lang.includes('as'));
      
      if (asVoice) {
        utterance.voice = asVoice;
        utterance.lang = 'as-IN';
      } else {
        utterance.lang = 'hi-IN';
      }
      
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function setInstruction(textInAssamese, speakAloud = true) {
    currentPrompt = textInAssamese;
    instructionText.textContent = textInAssamese;
    if (speakAloud) speak(textInAssamese);
  }

  function repeatInstruction() {
    if (currentPrompt) speak(currentPrompt);
  }

  // --- Inactivity Logic ---
  function resetIdleTimer() {
    if (idleTimer) clearTimeout(idleTimer);
    hideEncouragement();

    if (matchedCount < currentPairs) {
      idleTimer = setTimeout(triggerInactivityPrompt, IDLE_TIMEOUT_MS);
    }
  }

  function triggerInactivityPrompt() {
    if (matchedCount === currentPairs) return;

    encouragementPopup.classList.add('show');
    const encouragementText = 'আগবাঢ়ি যাওক!'; 
    speak(encouragementText);

    if (popupHideTimer) clearTimeout(popupHideTimer);
    popupHideTimer = setTimeout(() => {
      hideEncouragement();
    }, 3500);

    idleTimer = setTimeout(triggerInactivityPrompt, IDLE_TIMEOUT_MS);
  }

  function hideEncouragement() {
    encouragementPopup.classList.remove('show');
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startTimer() {
    if (!timerStarted) {
      timerStarted = true;
      timerInterval = setInterval(() => {
        secondsElapsed++;
        timerEl.textContent = `${secondsElapsed}s`;
      }, 1000);
    }
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timerStarted = false;
    if (idleTimer) clearTimeout(idleTimer);
  }

  function resetMetrics() {
    stopTimer();
    secondsElapsed = 0;
    timerStarted = false;
    timerEl.textContent = '0s';
  }

  function renderSubLevelButtons() {
    subControls.innerHTML = '';
    const levels = SUB_LEVELS[currentTier];

    levels.forEach((lvl, idx) => {
      const btn = document.createElement('button');
      btn.className = 'sub-btn' + (idx === currentSubIndex ? ' active' : '');
      btn.textContent = lvl.label;
      btn.addEventListener('click', () => {
        currentSubIndex = idx;
        renderSubLevelButtons();
        buildDeck();
      });
      subControls.appendChild(btn);
    });
  }

  function buildDeck(){
    resetMetrics();

    const lvlConfig = SUB_LEVELS[currentTier][currentSubIndex];
    currentPairs = lvlConfig.pairs;
    grid.style.setProperty('--cols', lvlConfig.cols);

    const chosen = shuffle(ITEMS).slice(0, currentPairs);
    deck = shuffle([...chosen, ...chosen]).map(item => ({ ...item, state:'down' }));
    flipped = [];
    matchedCount = 0;
    moves = 0;
    locked = false;
    pairsTotalEl.textContent = currentPairs;
    
    render();
    updateStats();
    setInstruction('স্বাগতম! ছবিৰ কাৰ্ডখনত টেপ কৰক।');
    resetIdleTimer();
  }

  function render(){
    grid.innerHTML = '';
    deck.forEach((c, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile' + (c.state === 'up' ? ' flipped' : '') + (c.state === 'matched' ? ' matched' : '') + (locked ? ' locked' : '');
      tile.innerHTML = `
        <div class="tile-inner">
          <div class="face face-back"><span class="mark">✺</span></div>
          <div class="face face-front">
            <img src="${c.img}" alt="${c.name || 'Card image'}" referrerpolicy="no-referrer" />
          </div>
        </div>
      `;
      tile.addEventListener('click', () => flipTile(i));
      grid.appendChild(tile);
    });
  }

  function updateStats(){
    movesEl.textContent = moves;
    pairsFoundEl.textContent = matchedCount;
  }

  function flipTile(i){
    if(locked) return;
    const c = deck[i];
    if(c.state !== 'down') return;
    if(flipped.length === 2) return;

    resetIdleTimer();
    startTimer();

    c.state = 'up';
    flipped.push(i);
    render();

    if(flipped.length === 1){
      setInstruction('আপুনি এখন কাৰ্ড খোলিলে। মিল থকা আনখন কাৰ্ড খোলক।');
    }

    if(flipped.length === 2){
      moves++;
      const [a, b] = flipped;

      if(deck[a].img === deck[b].img){
        deck[a].state = 'matched';
        deck[b].state = 'matched';
        matchedCount++;
        flipped = [];
        render();
        updateStats();
        
        if(matchedCount === currentPairs){
          stopTimer();
          setInstruction(`বহুত ধুনীয়া! আপুনি ${moves} টা চেষ্টাত সকলো মিল বিচাৰি পালে।`);
        } else {
          setInstruction(`সঠিক মিল! ${deck[a].name || ''}। আপুনি এটা যোৰ বিচাৰি পালে।`);
        }
      } else {
        locked = true;
        updateStats();
        setInstruction('মিল নাই। কাৰ্ড দুখন মনত ৰাখিবলৈ চেষ্টা কৰক।');
        render();
        setTimeout(() => {
          deck[a].state = 'down';
          deck[b].state = 'down';
          flipped = [];
          locked = false;
          render();
          setInstruction('পুনৰ চেষ্টা কৰিবলৈ কাৰ্ডত টেপ কৰক।');
          resetIdleTimer();
        }, FLIPBACK_DELAY);
      }
    }
  }

  // Handle Main Tier Selection
  tierControls.querySelectorAll('.tier-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      tierControls.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentTier = e.target.dataset.tier;
      currentSubIndex = 0;
      renderSubLevelButtons();
      buildDeck();
    });
  });

  newGameBtn.addEventListener('click', buildDeck);

  // Initialize
  renderSubLevelButtons();
  buildDeck();
</script>

</body>
